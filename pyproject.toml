[project]
name = "memes-api"
description = "A memes API"
version = "0.0.5"
authors = [{ name = "James Hogkinson", email = "james@terminaloutcomes.com" }]
requires-python = "<4.0,>=3.13"
dependencies = [
    "aioboto3>=15.1.0",
    "aiobotocore>=2.24.0",
    "click>=8.1.8",
    "fastapi[standard]>=0.118.0",
    "Jinja2>=3.1.6",
    "Pillow>=11.2.1",
    "pydantic>=2.11.3",
    "types-Pillow>=10.2.0",
    "uvicorn==0.54.0",
]
readme = "README.md"

[project.license]
text = "MPL 2.0"

[project.scripts]
memes-api = "memes_api.__main__:cli"
memes-healthcheck = "memes_api.healthcheck:cli"

[tool.mypy]
plugins = "pydantic.mypy"

[tool.coverage.run]
omit = ["tests/*"]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "boto3-stubs>=1.37.36",
    "coverage>=7.16.2",
    "coveralls>=4.0.1",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "testcontainers[localstack]>=4.15.0",
    "ty>=0.0.85",
    "types-pillow>=10.2.0.20240822",
]
